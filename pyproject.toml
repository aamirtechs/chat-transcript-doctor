[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "chat-transcript-doctor"
version = "1.0.0"
description = "Audit a LiveChat or support chat transcript CSV export"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"

[project.scripts]
chat-transcript-doctor = "chat_transcript_doctor:main_entry"

[tool.setuptools]
py-modules = ["chat_transcript_doctor"]
